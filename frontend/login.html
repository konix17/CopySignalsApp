<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#090b10" media="(prefers-color-scheme: dark)" />
  <title>Log in · Copy Signals</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <svg class="sprite" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="logo-grad-a" /><stop offset="1" class="logo-grad-b" /></linearGradient>
  </defs></svg>
  <main class="login-box">
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="bg" width="32" height="32" rx="9" /><path class="ln" d="M7 21l6-6 4 4 8-9" /></svg>
      <h1 class="brand">Copy Signals<small>Crypto signals &amp; auto-trading</small></h1>
    </div>
    <form id="login-form" class="form" autocomplete="on">
      <label>Username <input name="username" autocomplete="username" required autofocus maxlength="64"
        spellcheck="false" autocapitalize="none" autocorrect="off" /></label>
      <label>Password <input type="password" name="password" autocomplete="current-password" required maxlength="512" /></label>
      <label id="code-row" hidden>Code from your authenticator app
        <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"
          spellcheck="false" title="The 6 digits your authenticator app shows" /></label>
      <button class="btn" type="submit">Log in</button>
      <p id="login-msg" class="form-msg" role="alert"></p>
    </form>
    <p class="login-foot">Research tool, not financial advice.</p>
  </main>
  <script src="login.js"></script>
</body>
</html>
